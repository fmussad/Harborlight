<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Harborlight</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #150e18;
        font-family: Ubuntu, 'Noto Sans', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      .splash {
        position: relative;
        height: 100%;
      }

      .art {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* The artwork fades into the footer so the text never sits on detail. */
      .footer {
        position: absolute;
        inset: auto 0 0 0;
        padding: 2rem 2rem 1.25rem;
        background: linear-gradient(to top, rgba(21, 14, 24, 0.96) 45%, rgba(21, 14, 24, 0));
      }

      .stage {
        margin: 0 0 0.6rem;
        font-size: 0.8125rem;
        line-height: 1.2;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.72);
      }

      .track {
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .bar {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(to right, #ff8a3d, #f04e23);
        transition: width 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <img id="art" class="art" alt="" />
      <div class="footer">
        <p id="stage" class="stage" role="status" aria-live="polite">Starting Harborlight</p>
        <div
          class="track"
          role="progressbar"
          aria-label="Loading Harborlight"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="track"
        >
          <div id="bar" class="bar"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/splash.ts"></script>
  </body>
</html>
